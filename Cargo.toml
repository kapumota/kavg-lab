[package]
name = "kavg-lab"
version = "0.9.0"
edition = "2021"
description = "CLI académico para promedios kernel, OSQP y demos de atención tipo Transformer"
license = "MIT"

[features]
default = []
parallel = ["dep:rayon"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
rayon = { version = "1", optional = true }

osqp = "0.6.3"
