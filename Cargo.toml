[package]
name = "kavg-lab"
version = "0.8.0"
edition = "2021"
description = "CLI académico para promedios kernel, OSQP y demos de atención tipo Transformer"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

osqp = "0.6.3"
