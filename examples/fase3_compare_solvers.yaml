dimension: 2
lambda1: 0.5

f1:
  type: quadratic
  matrix:
    - [2.0, 0.0]
    - [0.0, 1.0]
  vector: [-1.0, 0.5]

f2:
  type: l1
  alpha: 0.2

kernel:
  type: squared-norm

solver:
  method: coordinate-descent
  initial_step: 0.1
  tolerance: 1.0e-8
  min_step: 1.0e-10
  max_iterations: 1000

points:
  - [0.0, 0.0]
  - [1.0, -1.0]
  - [2.0, 0.5]
