dimension: 2
lambda1: 0.5

f1:
  type: quadratic
  matrix:
    - [1.0, 0.0]
    - [0.0, 1.0]
  vector: [0.2, -0.1]

f2:
  type: l2
  alpha: 1.5

kernel:
  type: squared-norm

solver:
  method: osqp
  initial_step: 1.0
  tolerance: 1.0e-8
  min_step: 1.0e-10
  max_iterations: 10000

# En verify-fenchel estos puntos son puntos duales.
points:
  - [0.5, -0.5]
  - [1.0, 0.25]
  - [-0.75, 0.8]
