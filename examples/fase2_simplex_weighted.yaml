dimension: 3
lambda1: 0.5

f1:
  type: l2
  alpha: 0.2

f2:
  type: indicator-simplex
  tolerance: 1.0e-8

kernel:
  type: weighted-squared-norm
  weights: [1.0, 2.0, 0.5]

solver:
  method: osqp
  initial_step: 0.1
  tolerance: 1.0e-8
  min_step: 1.0e-10
  max_iterations: 10000

points:
  - [0.4, 0.3, 0.3]
  - [0.2, 0.5, 0.3]
