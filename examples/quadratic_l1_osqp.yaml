dimension: 2
lambda1: 0.5

f1:
  type: quadratic
  matrix:
    - [1.0, 0.0]
    - [0.0, 1.0]
  vector: [0.0, 0.0]

f2:
  type: l1
  alpha: 0.7

kernel:
  type: squared-norm

solver:
  method: osqp
  initial_step: 1.0
  tolerance: 1.0e-8
  min_step: 1.0e-10
  max_iterations: 10000

points:
  - [1.0, 1.0]
  - [2.0, -1.0]
  - [0.0, 0.5]
